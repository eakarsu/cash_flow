name: CI
on:
  push:
  pull_request:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.1.0
          cache: npm
      - run: npm ci
      - name: Apply and replay checked-in migrations
        env: &test-env
          NODE_ENV: test
          LEDGER_DATABASE_PATH: test-results/ci-ledger.sqlite
          OPERATOR_API_TOKEN: ci-operator-test-only
          AUDITOR_API_TOKEN: ci-auditor-test-only
          PROVIDER_WEBHOOK_SECRET: ci-provider-test-only
          IDENTITY_HASH_SECRET: ci-identity-test-only
          LICENSED_PROVIDERS: licensed-bank,licensed-broker
          LIVE_TRADING_ENABLED: "false"
        run: npm run db:migrate && npm run db:migrate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run build
      - run: npm run security:audit
      - run: docker build .
